<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>SocialSuite OBS Connector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f1a;
      --surface: #1a1a2e;
      --border:  #2e2e4a;
      --text:    #e8e8f0;
      --muted:   #888;
      --accent:  #7c3aed;
      --green:   #22c55e;
      --amber:   #f59e0b;
      --red:     #ef4444;
      --input-bg:#111827;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .field { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }

    input {
      width: 100%;
      padding: 8px 10px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: #444; }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-connect    { background: var(--accent); color: #fff; }
    .btn-disconnect { background: var(--border);  color: var(--muted); }
    .btn:disabled   { opacity: .5; cursor: not-allowed; }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .status-card .label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
    .status-card .value {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-green  { background: var(--green);  box-shadow: 0 0 4px var(--green); }
    .dot-amber  { background: var(--amber); }
    .dot-red    { background: var(--red); }
    .dot-grey   { background: var(--muted); }

    .error-msg {
      margin-top: 10px;
      font-size: 11px;
      color: var(--red);
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>SocialSuite · OBS Connector</h1>

  <div class="field">
    <label>Token</label>
    <input id="token" type="text" placeholder="oc1.…" autocomplete="off" spellcheck="false" />
  </div>
  <div class="field">
    <label>OBS Passwort</label>
    <input id="password" type="password" placeholder="Leer lassen wenn kein Passwort" />
  </div>

  <button id="btn" class="btn btn-connect">Verbinden</button>

  <div class="status-grid">
    <div class="status-card">
      <div class="label">Relay</div>
      <div class="value" id="relay-val">
        <span class="dot dot-grey" id="relay-dot"></span>
        <span id="relay-text">Getrennt</span>
      </div>
    </div>
    <div class="status-card">
      <div class="label">OBS</div>
      <div class="value" id="obs-val">
        <span class="dot dot-grey" id="obs-dot"></span>
        <span id="obs-text">Getrennt</span>
      </div>
    </div>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <script src="app.js"></script>
</body>
</html>
