name: Build & Release OBS Connector

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_vps:
        description: 'Upload builds to VPS after build'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS (arm64 + x64)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SKIP_NOTARIZE: true

      - name: Ad-hoc sign (bypass Gatekeeper quarantine)
        run: |
          codesign --deep --force --sign - "dist/mac-arm64/SocialSuite OBS Connector.app" 2>/dev/null || true
          codesign --deep --force --sign - "dist/mac/SocialSuite OBS Connector.app" 2>/dev/null || true

      - name: Rebuild DMGs with signed app
        run: |
          rm -f dist/*.dmg
          hdiutil create -volname "SocialSuite OBS Connector" \
            -srcfolder "dist/mac-arm64/SocialSuite OBS Connector.app" \
            -ov -format UDZO "dist/SocialSuite-OBS-Connector-arm64.dmg"
          hdiutil create -volname "SocialSuite OBS Connector" \
            -srcfolder "dist/mac/SocialSuite OBS Connector.app" \
            -ov -format UDZO "dist/SocialSuite-OBS-Connector-x64.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (x64)
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-builds
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SocialSuite OBS Connector ${{ github.ref_name }}"
          body: |
            ## SocialSuite OBS Connector ${{ github.ref_name }}

            Verbindet OBS mit SocialSuite — kein Port-Forwarding nötig.

            ### Download
            - **macOS (Apple Silicon):** `SocialSuite-OBS-Connector-arm64.dmg`
            - **macOS (Intel):** `SocialSuite-OBS-Connector-x64.dmg`
            - **Windows:** `SocialSuite-OBS-Connector-Setup.exe`

            ### Setup
            1. App starten
            2. Token aus SocialSuite Dashboard eingeben (Live Suite → OBS → Connector koppeln)
            3. OBS Passwort eingeben
            4. „Verbinden" klicken
          files: dist/*
          draft: false
          prerelease: false

  deploy-to-vps:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: >
      (startsWith(github.ref, 'refs/tags/v') ||
       github.event.inputs.upload_to_vps == 'true')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Upload builds to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/*"
          target: "/home/ubuntu/.cursor/projects/1777922451599/socialsuite-pro/public/downloads/"
          strip_components: 1
